name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像自带 Android SDK（build-tools/platforms/cmake/NDK 27），
      # 无需 setup-android / setup-ndk

      - name: SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Fetch deps
        run: bash tools/fetch_deps.sh

      - name: Build module zip
        run: |
          bash tools/build.sh 2>&1 | tee /tmp/build_log.txt
          exit ${PIPESTATUS[0]}
      - name: Build log tail (on failure)
        if: failure()
        run: tail -60 /tmp/build_log.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: clipshield-module
          path: dist/*.zip
